name: Sync org profile showcase

# Keeps the "Projects" section of profile/README.md in sync with the org's
# public repositories. Runs nightly so a newly published repo shows up on
# https://github.com/yvyty without anyone pushing, and on demand from the
# Actions tab. The commit it makes uses GITHUB_TOKEN, so it never re-triggers
# this workflow.
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "profile/README.md"
      - "scripts/sync-projects.mjs"
      - ".github/workflows/sync-profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync projects into profile/README.md
        run: node scripts/sync-projects.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Profile is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          git commit -m "chore: sync org project showcase"
          git push
