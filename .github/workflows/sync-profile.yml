name: Sync org profile showcase

# Keeps the "Projects" section of profile/README.md in sync with the org's
# public repositories. Runs nightly so a newly published repo shows up on
# https://github.com/yvyty without anyone pushing, and on demand from the
# Actions tab. main is protected by a ruleset that requires pull requests, so
# the change lands via a PR from the automation/profile-sync branch that the
# job then merges. Both use GITHUB_TOKEN, so the merge never re-triggers this
# workflow.
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "profile/README.md"
      - "scripts/sync-projects.mjs"
      - ".github/workflows/sync-profile.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: profile-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync projects into profile/README.md
        run: node scripts/sync-projects.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open sync pull request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/profile-sync
          delete-branch: true
          add-paths: profile/README.md
          commit-message: "chore: sync org project showcase"
          title: "chore: sync org project showcase"
          body: |
            Automated refresh of the PROJECTS block in `profile/README.md`
            by `scripts/sync-projects.mjs`.
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

      - name: Merge sync pull request
        if: steps.cpr.outputs.pull-request-number != ''
        run: gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
